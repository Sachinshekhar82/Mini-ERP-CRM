name: Build & Test CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install
      - name: Generate Prisma Client & Push DB
        run: |
          cd backend
          npx prisma db push --force-reset
          npm run seed
      - name: Build & Run Master QA Audit Tests
        run: |
          cd backend
          npm run build
          npx ts-node src/testMasterE2E.ts

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install
      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
